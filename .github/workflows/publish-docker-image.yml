name: publish-docker-image

# 手动构建多架构极简镜像（Alpine + 静态 Go 二进制）并推送至 GHCR。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像 tag（如 v0.1.0；同时写入 APP_VERSION）"
        required: true
        type: string
      also_latest:
        description: "同时推送 :latest"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::invalid version '$VERSION' (Docker tag rules: letters/digits/._-), e.g. v0.1.0"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.also_latest }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ inputs.version }}

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Minimal image published"
            echo ""
            echo "- version: \`$VERSION\`"
            echo "- platforms: \`linux/amd64, linux/arm64\`"
            echo "- tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
