name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Web build, Go vet, test (-race) & binary build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Typecheck & build web console
        run: npm run build --prefix web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go test (-race)
        run: go test -race -v ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.Version=ci-${GITHUB_SHA::7}" -o dist/bohrium-club-auto ./cmd/bohrium-club-auto
